<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>UZX Admin — Comunicados</title>
  <link rel="stylesheet" href="css/styles.css"/>
  <style>
    .ann-card {
      background: white;
      border: 1.5px solid var(--border);
      border-radius: var(--radius-lg);
      overflow: hidden;
      margin-bottom: 0.75rem;
      transition: var(--transition);
    }
    .ann-card:hover { border-color: var(--primary); box-shadow: var(--shadow-md); }
    .ann-card-header {
      display: flex; align-items: flex-start; gap: 1rem;
      padding: 1rem 1.25rem;
    }
    .ann-image { width: 80px; height: 60px; object-fit: cover; border-radius: var(--radius); flex-shrink: 0; }
    .ann-info { flex: 1; }
    .ann-title { font-weight: 700; font-size: 0.95rem; margin-bottom: 0.25rem; }
    .ann-preview { font-size: 0.8rem; color: var(--text-secondary); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 500px; }
    .ann-meta { display: flex; gap: 0.75rem; align-items: center; margin-top: 0.4rem; font-size: 0.75rem; color: var(--text-muted); }
    .ann-actions { display: flex; gap: 0.4rem; align-items: center; flex-shrink: 0; }

    .ann-filters {
      display: flex;
      gap: 0.5rem;
      margin-bottom: 1.5rem;
      flex-wrap: wrap;
      padding: 0.75rem 1rem;
      background: var(--bg-secondary);
      border-radius: var(--radius);
      border: 1px solid var(--border);
    }
    .ann-filter-btn {
      padding: 0.4rem 1rem;
      border-radius: 20px;
      border: 1.5px solid var(--border);
      background: var(--bg-card);
      color: var(--text-muted);
      font-size: 0.78rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
      font-family: var(--font-body);
    }
    .ann-filter-btn:hover {
      border-color: var(--primary);
      color: var(--primary);
    }
    .ann-filter-btn.active {
      background: var(--primary-light);
      border-color: var(--primary);
      color: var(--primary);
      font-weight: 700;
    }
    .ann-filter-btn.filter-all.active {
      background: var(--primary);
      border-color: var(--primary);
      color: white;
    }
    .ann-filter-btn.filter-oficial.active { background: #10b981; border-color: #10b981; color: white; }
    .ann-filter-btn.filter-tier.active { background: #3b82f6; border-color: #3b82f6; color: white; }
    .ann-filter-btn.filter-girls.active { background: #ec4899; border-color: #ec4899; color: white; }
    .ann-filter-btn.filter-gold.active { background: #f59e0b; border-color: #f59e0b; color: white; }
  </style>
</head>
<body>
<div id="app">
  <aside class="sidebar" id="sidebar"></aside>
  <main class="main-content">
    <div class="page-header">
      <div>
        <div class="page-title">Comunicados</div>
        <div class="page-subtitle">Noticias y anuncios para la comunidad</div>
      </div>
      <button class="btn btn-primary" id="btn-new-ann">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" width="14" height="14"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        Nuevo Comunicado
      </button>
    </div>

    <div class="ann-filters" id="ann-filters"></div>

    <div id="ann-list">
      <div class="loading-inline">Cargando comunicados...</div>
    </div>
  </main>
</div>

<div class="modal-overlay" id="ann-modal-overlay">
  <div class="modal modal-xl" id="ann-modal">
    <div class="modal-header">
      <span class="modal-title" id="ann-modal-title">Nuevo Comunicado</span>
      <button class="modal-close" onclick="closeAnnModal()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>
    <div class="modal-body">
      <input type="hidden" id="ann-id" />
      <div class="form-group">
        <label class="form-label">Título <span class="required">*</span></label>
        <input type="text" class="form-control" id="ann-title" placeholder="Título del comunicado" />
      </div>
      <div class="form-row">
        <div class="form-group">
          <label class="form-label">Dirigido a</label>
          <select class="form-control" id="ann-target">
            <!-- Las opciones se llenan dinámicamente según permisos -->
          </select>
        </div>
        <div class="form-group">
          <label class="form-label">Estado</label>
          <select class="form-control" id="ann-published">
            <option value="false">Borrador</option>
            <option value="true">Publicado</option>
          </select>
        </div>
      </div>
      <div class="form-group">
        <label class="form-label">Contenido <span class="required">*</span></label>
        <textarea class="form-control" id="ann-content" rows="6" placeholder="Escribe el contenido del comunicado..."></textarea>
      </div>
      <div class="form-group">
        <label class="form-label">Imagen (opcional)</label>
        <input type="file" id="ann-image-input" accept="image/*" style="display:none" onchange="handleAnnImage(this)" />
        <div style="display:flex;align-items:center;gap:0.75rem">
          <button class="btn btn-secondary btn-sm" onclick="document.getElementById('ann-image-input').click()">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="14" height="14"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>
            Seleccionar imagen
          </button>
          <button class="btn btn-danger btn-sm" id="btn-remove-ann-image" style="display:none" onclick="removeAnnImage()">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="14" height="14"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
            Quitar
          </button>
        </div>
        <img id="ann-image-preview" src="" alt="" style="display:none;max-width:300px;max-height:150px;margin-top:0.5rem;border-radius:var(--radius);border:1px solid var(--border)" />
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-ghost" onclick="closeAnnModal()">Cancelar</button>
      <button class="btn btn-primary" id="btn-save-ann" onclick="saveAnnouncement()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" width="14" height="14"><polyline points="20 6 9 17 4 12"/></svg>
        Guardar
      </button>
    </div>
  </div>
</div>

<!-- Modal de confirmación para eliminar comunicado -->
<div class="modal-overlay" id="confirm-ann-modal">
  <div class="modal" style="max-width:400px;text-align:center">
    <div class="modal-body" style="padding:2rem">
      <div style="width:56px;height:56px;border-radius:50%;background:var(--danger-bg);border:2px solid var(--danger);display:flex;align-items:center;justify-content:center;margin:0 auto 1rem">
        <svg viewBox="0 0 24 24" fill="none" stroke="var(--danger)" stroke-width="2" width="28" height="28">
          <path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/>
          <line x1="12" y1="9" x2="12" y2="13"/>
          <line x1="12" y1="17" x2="12.01" y2="17"/>
        </svg>
      </div>
      <h3 style="margin:0 0 0.5rem;font-family:var(--font-display);font-weight:800" id="confirm-ann-title">¿Eliminar comunicado?</h3>
      <p style="color:var(--text-secondary);margin-bottom:1.5rem" id="confirm-ann-message">Esta acción no se puede deshacer</p>
      <div style="display:flex;gap:0.75rem;justify-content:center">
        <button class="btn btn-ghost" onclick="closeConfirmAnn()">Cancelar</button>
        <button class="btn btn-danger" id="confirm-ann-delete-btn">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" width="14" height="14">
            <polyline points="3 6 5 6 21 6"/>
            <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/>
          </svg>
          Eliminar
        </button>
      </div>
    </div>
  </div>
</div>

<script src="js/core/config.js"></script>
<script src="js/core/api.js"></script>
<script src="js/core/auth.js"></script>
<script src="js/core/icons.js"></script>
<script src="js/core/rosters.js"></script>
<script src="js/components/index.js"></script>
<script>
AUTH.requireAuth();

// ============================================================
// MANEJAR ERROR DE ROSTER INACTIVO
// ============================================================

function handleRosterInactiveError(error) {
  if (error.message && (
    error.message.includes('inactivo') ||
    error.message.includes('desactivado') ||
    error.message.includes('inactive') ||
    error.message.includes('acceso denegado') ||
    error.message.includes('no tienes permisos')
  )) {
    Toast.error('Tu roster está desactivado. No tienes acceso hasta que un administrador lo reactive.');
    return true;
  }
  return false;
}

// ============================================================
// CONFIGURACIÓN DE PERMISOS Y FILTROS
// ============================================================

const ANNOUNCEMENT_FILTERS = {
  ALL: { id: 'ALL', label: 'Todos', class: 'filter-all' },
  OFICIAL: { id: 'OFICIAL', label: 'UZX OFICIAL', class: 'filter-oficial' },
  TIER: { id: 'TIER', label: 'UZX TIER', class: 'filter-tier' },
  GIRLS: { id: 'GIRLS', label: 'UZX GIRLS', class: 'filter-girls' },
  GOLD: { id: 'GOLD', label: 'UZX GOLD', class: 'filter-gold' }
};

const ROLE_TARGETS = {
  'admin': ['ALL', 'OFICIAL', 'TIER', 'GIRLS', 'GOLD'],
  'admintier': ['TIER'],
  'admingold': ['GOLD'],
  'admingirls': ['GIRLS']
};

let annImageBase64 = null;
let currentFilter = 'ALL';
let allAnnouncements = [];

// ============================================================
// OBTENER ROL DEL USUARIO
// ============================================================

function getUserRole() {
  if (typeof RosterPermissions !== 'undefined') {
    return RosterPermissions.getUserRole();
  }
  try {
    const userData = localStorage.getItem('uzx_admin_user');
    if (userData && userData.startsWith('{')) {
      const parsed = JSON.parse(userData);
      return parsed.role || parsed.rol || parsed.userRole || 'admin';
    }
  } catch {}
  return 'admin';
}

function getAvailableTargets() {
  const role = getUserRole();
  return ROLE_TARGETS[role] || ROLE_TARGETS['admin'];
}

function isGlobalAdmin() {
  return getUserRole() === 'admin';
}

// ============================================================
// RENDER FILTROS
// ============================================================

function renderFilters() {
  const container = document.getElementById('ann-filters');
  const availableTargets = getAvailableTargets();

  if (availableTargets.length <= 1) {
    container.style.display = 'none';
    return;
  }

  container.style.display = 'flex';
  container.innerHTML = availableTargets.map(targetId => {
    const filter = ANNOUNCEMENT_FILTERS[targetId];
    if (!filter) return '';
    const isActive = currentFilter === targetId ? 'active' : '';
    return `
      <button class="ann-filter-btn ${filter.class} ${isActive}" data-filter="${targetId}">
        ${filter.label}
      </button>
    `;
  }).join('');

  container.querySelectorAll('.ann-filter-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      container.querySelectorAll('.ann-filter-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      currentFilter = btn.dataset.filter;
      renderAnnouncements(allAnnouncements);
    });
  });
}

// ============================================================
// RENDER TARGETS EN MODAL
// ============================================================

function renderTargetOptions() {
  const select = document.getElementById('ann-target');
  const availableTargets = getAvailableTargets();

  select.innerHTML = availableTargets.map(targetId => {
    const filter = ANNOUNCEMENT_FILTERS[targetId];
    if (!filter) return '';
    const label = targetId === 'ALL' ? 'Todos los squads' : filter.label;
    return `<option value="${targetId}">${label}</option>`;
  }).join('');
}

// ============================================================
// LOAD ANNOUNCEMENTS
// ============================================================

async function loadAnnouncements() {
  try {
    const res = await API.aGet('/admin/announcements');
    allAnnouncements = res.data;
    renderAnnouncements(allAnnouncements);
  } catch (e) {
    // 🔥 Verificar si es error de roster inactivo
    if (handleRosterInactiveError(e)) {
      document.getElementById('ann-list').innerHTML = `
        <div class="empty-state">
          <div class="empty-state-icon">🔒</div>
          <h3>Acceso restringido</h3>
          <p>Tu roster está desactivado. No tienes acceso hasta que un administrador lo reactive.</p>
        </div>`;
      return;
    }
    document.getElementById('ann-list').innerHTML = `<div class="empty-state"><p style="color:var(--danger)">${e.message}</p></div>`;
    Toast.error(e.message);
  }
}

// ============================================================
// RENDER ANNOUNCEMENTS CON FILTRO
// ============================================================

function renderAnnouncements(anns) {
  const el = document.getElementById('ann-list');

  let filtered = anns;
  if (currentFilter !== 'ALL') {
    filtered = anns.filter(a => a.target === currentFilter);
  }

  if (!isGlobalAdmin()) {
    const allowedTargets = getAvailableTargets();
    filtered = filtered.filter(a => allowedTargets.includes(a.target));
  }

  if (!filtered.length) {
    el.innerHTML = `
      <div class="empty-state">
        <div class="empty-state-icon">${Icons.announcements}</div>
        <h3>Sin comunicados</h3>
        <p>${currentFilter === 'ALL' ? 'Crea el primer comunicado' : 'No hay comunicados para este squad'}</p>
      </div>`;
    return;
  }

  const targetLabels = { 
    ALL: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="12" height="12"><circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg> Todos', 
    OFICIAL: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="12" height="12" style="color:var(--oficial)"><circle cx="12" cy="12" r="10"/></svg> OFICIAL', 
    TIER: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="12" height="12" style="color:var(--tier)"><circle cx="12" cy="12" r="10"/></svg> TIER', 
    GIRLS: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="12" height="12" style="color:var(--girls)"><circle cx="12" cy="12" r="10"/></svg> GIRLS',
    GOLD: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="12" height="12" style="color:#f59e0b"><circle cx="12" cy="12" r="10"/></svg> GOLD'
  };

  el.innerHTML = filtered.map(a => `
    <div class="ann-card">
      <div class="ann-card-header">
        ${a.imageBase64 ? `<img class="ann-image" src="${a.imageBase64}" alt="" />` : ''}
        <div class="ann-info">
          <div class="ann-title">${a.title}</div>
          <div class="ann-preview">${a.content}</div>
          <div class="ann-meta">
            <span>${targetLabels[a.target] || a.target}</span>
            <span>•</span>
            <span>${new Date(a.createdAt).toLocaleDateString('es', { day:'2-digit', month:'short', year:'numeric' })}</span>
            <span class="badge ${a.isPublished ? 'badge-published' : 'badge-draft'}">${a.isPublished ? '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" width="10" height="10"><polyline points="20 6 9 17 4 12"/></svg> Publicado' : '○ Borrador'}</span>
          </div>
        </div>
        <div class="ann-actions">
          <button class="btn btn-secondary btn-sm" onclick="togglePublished('${a.id}', ${a.isPublished})">
            ${a.isPublished ? 'Despublicar' : 'Publicar'}
          </button>
          <button class="btn btn-secondary btn-sm btn-icon" onclick="editAnnouncement('${a.id}')" title="Editar">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="14" height="14"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
          </button>
          <button class="btn btn-danger btn-sm btn-icon" onclick="deleteAnnouncement('${a.id}', '${a.title.replace(/'/g,"\\'")}')" title="Eliminar">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="14" height="14"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
          </button>
        </div>
      </div>
    </div>
  `).join('');
}

// ============================================================
// CRUD ANNOUNCEMENTS
// ============================================================

function handleAnnImage(input) {
  const file = input.files[0];
  if (!file) return;
  if (file.size > 3 * 1024 * 1024) { Toast.error('La imagen no debe superar 3MB'); return; }
  const reader = new FileReader();
  reader.onload = (ev) => {
    annImageBase64 = ev.target.result;
    const preview = document.getElementById('ann-image-preview');
    preview.src = annImageBase64;
    preview.style.display = 'block';
    document.getElementById('btn-remove-ann-image').style.display = 'inline-flex';
  };
  reader.readAsDataURL(file);
}

function removeAnnImage() {
  annImageBase64 = null;
  document.getElementById('ann-image-preview').style.display = 'none';
  document.getElementById('btn-remove-ann-image').style.display = 'none';
  document.getElementById('ann-image-input').value = '';
}

async function saveAnnouncement() {
  const id = document.getElementById('ann-id').value;
  const title = document.getElementById('ann-title').value.trim();
  const content = document.getElementById('ann-content').value.trim();
  if (!title || !content) { Toast.warning('Título y contenido son requeridos'); return; }

  const target = document.getElementById('ann-target').value;

  const allowedTargets = getAvailableTargets();
  if (!allowedTargets.includes(target)) {
    Toast.error('No tienes permisos para publicar en este squad');
    return;
  }

  const payload = {
    title, content,
    target: target,
    isPublished: document.getElementById('ann-published').value === 'true',
    imageBase64: annImageBase64 || null,
  };

  const btn = document.getElementById('btn-save-ann');
  btn.disabled = true; 
  btn.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="14" height="14" style="animation:spin 0.8s linear infinite"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg> Guardando...`;
  try {
    if (id) {
      await API.aPut(`/admin/announcements/${id}`, payload);
      Toast.success('Comunicado actualizado');
    } else {
      await API.aPost('/admin/announcements', payload);
      Toast.success('Comunicado creado');
    }
    closeAnnModal();
    loadAnnouncements();
  } catch (e) {
    if (handleRosterInactiveError(e)) {
      closeAnnModal();
      return;
    }
    Toast.error(e.message);
  } finally { 
    btn.disabled = false; 
    btn.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" width="14" height="14"><polyline points="20 6 9 17 4 12"/></svg> Guardar`;
  }
}

function editAnnouncement(id) {
  API.aGet('/admin/announcements')
    .then(res => {
      const a = res.data.find(x => x.id === id);
      if (!a) return;

      const allowedTargets = getAvailableTargets();
      if (!allowedTargets.includes(a.target)) {
        Toast.error('No tienes permisos para editar este comunicado');
        return;
      }

      document.getElementById('ann-id').value = a.id;
      document.getElementById('ann-title').value = a.title;
      document.getElementById('ann-content').value = a.content;
      document.getElementById('ann-target').value = a.target;
      document.getElementById('ann-published').value = String(a.isPublished);
      if (a.imageBase64) {
        annImageBase64 = a.imageBase64;
        const preview = document.getElementById('ann-image-preview');
        preview.src = a.imageBase64;
        preview.style.display = 'block';
        document.getElementById('btn-remove-ann-image').style.display = 'inline-flex';
      }
      document.getElementById('ann-modal-title').textContent = 'Editar Comunicado';
      document.getElementById('ann-modal-overlay').classList.add('show');
      document.body.style.overflow = 'hidden';
    })
    .catch(e => {
      if (handleRosterInactiveError(e)) return;
      Toast.error(e.message);
    });
}

async function togglePublished(id, current) {
  try {
    const res = await API.aGet('/admin/announcements');
    const ann = res.data.find(x => x.id === id);
    if (ann) {
      const allowedTargets = getAvailableTargets();
      if (!allowedTargets.includes(ann.target)) {
        Toast.error('No tienes permisos para modificar este comunicado');
        return;
      }
    }

    await API.aPut(`/admin/announcements/${id}`, { isPublished: !current });
    Toast.success(current ? 'Comunicado despublicado' : 'Comunicado publicado');
    loadAnnouncements();
  } catch (e) {
    if (handleRosterInactiveError(e)) return;
    Toast.error(e.message);
  }
}

let pendingAnnDeleteId = null;
let pendingAnnDeleteTitle = '';

function deleteAnnouncement(id, title) {
  pendingAnnDeleteId = id;
  pendingAnnDeleteTitle = title;
  
  document.getElementById('confirm-ann-title').textContent = `¿Eliminar "${title}"?`;
  document.getElementById('confirm-ann-modal').classList.add('show');
  document.body.style.overflow = 'hidden';
  
  document.getElementById('confirm-ann-delete-btn').onclick = async function() {
    try {
      await API.aDelete(`/admin/announcements/${pendingAnnDeleteId}`);
      Toast.success('Comunicado eliminado');
      closeConfirmAnn();
      loadAnnouncements();
    } catch (e) {
      if (handleRosterInactiveError(e)) {
        closeConfirmAnn();
        return;
      }
      Toast.error(e.message);
    }
  };
}

function closeConfirmAnn() {
  document.getElementById('confirm-ann-modal').classList.remove('show');
  document.body.style.overflow = '';
  pendingAnnDeleteId = null;
  pendingAnnDeleteTitle = '';
}

function openAnnModal() {
  document.getElementById('ann-id').value = '';
  document.getElementById('ann-title').value = '';
  document.getElementById('ann-content').value = '';
  document.getElementById('ann-published').value = 'false';
  annImageBase64 = null;
  document.getElementById('ann-image-preview').style.display = 'none';
  document.getElementById('btn-remove-ann-image').style.display = 'none';
  document.getElementById('ann-modal-title').textContent = 'Nuevo Comunicado';

  renderTargetOptions();

  const select = document.getElementById('ann-target');
  if (select.options.length > 0) {
    select.selectedIndex = 0;
  }

  document.getElementById('ann-modal-overlay').classList.add('show');
  document.body.style.overflow = 'hidden';
}

function closeAnnModal() {
  document.getElementById('ann-modal-overlay').classList.remove('show');
  document.body.style.overflow = '';
}

// ============================================================
// INICIALIZACIÓN
// ============================================================

document.getElementById('btn-new-ann').addEventListener('click', openAnnModal);

document.getElementById('confirm-ann-modal').addEventListener('click', function(e) {
  if (e.target === this) closeConfirmAnn();
});

document.addEventListener('keydown', function(e) {
  if (e.key === 'Escape') {
    closeAnnModal();
    closeConfirmAnn();
  }
});

Sidebar.render('announcements', () => {});
renderFilters();
loadAnnouncements();
</script>
</body>
</html>
